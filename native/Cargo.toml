[package]
name = "c3dgl-native"
version = "0.1.0"
edition = "2021"
publish = false

[features]
host-tests = []
# Use the application-owned std runtime/allocator; compile the libctru adapter.
rust3ds = []

[lib]
name = "c3dgl"
crate-type = ["staticlib", "rlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
